<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Icon background (dark slate, developer theme) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Colour accent of the collar (orange and amber) -->
    <linearGradient id="collar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Drop shadow for the dog's head -->
    <filter id="dog-shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#020617" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Icon base (squircle) with a faint outline -->
  <rect x="24" y="24" width="464" height="464" rx="110"
        fill="url(#bg-grad)" stroke="#334155" stroke-width="4" />

  <!-- Subtle developer grid in the background (an optional touch) -->
  <g stroke="#334155" stroke-width="1.5" opacity="0.25">
    <line x1="24" y1="160" x2="488" y2="160" />
    <line x1="24" y1="352" x2="488" y2="352" />
    <line x1="160" y1="24" x2="160" y2="488" />
    <line x1="352" y1="24" x2="352" y2="488" />
  </g>

  <!-- Decorative code braces in the background -->
  <text x="58" y="135" font-family="monospace" font-weight="900" font-size="64" fill="#38BDF8" opacity="0.15">{</text>
  <text x="415" y="425" font-family="monospace" font-weight="900" font-size="64" fill="#38BDF8" opacity="0.15">}</text>

  <!-- The dog -->
  <g filter="url(#dog-shadow)">

    <!-- Left ear: standing, bent at the tip -->
    <path d="M 135 190 L 95 95 C 90 75, 115 65, 135 80 L 205 145 Z"
          fill="#64748B" stroke="#0F172A" stroke-width="12" stroke-linejoin="round" />
    <!-- Inside of the left ear -->
    <path d="M 135 165 L 112 105 L 165 145 Z" fill="#FDA4AF" opacity="0.8" />

    <!-- Right ear: floppy (dark grey, like the eye patch) -->
    <path d="M 355 155 C 405 140, 445 190, 425 260 C 410 305, 365 295, 365 245 Z"
          fill="#475569" stroke="#0F172A" stroke-width="12" stroke-linejoin="round" />

    <!-- Neck / body at the base -->
    <path d="M 165 340 L 145 415 C 145 435, 367 435, 367 415 L 347 340 Z"
          fill="#94A3B8" stroke="#0F172A" stroke-width="12" stroke-linejoin="round" />

    <!-- Head (rounded kawaii shape) -->
    <path d="M 115 255 C 105 155, 175 120, 256 120 C 337 120, 407 155, 397 255 C 390 335, 340 365, 256 365 C 172 365, 122 335, 115 255 Z"
          fill="#E2E8F0" stroke="#0F172A" stroke-width="12" stroke-linejoin="round" />

    <!-- Eye patch around the left eye (slate grey) -->
    <path d="M 122 225 C 125 160, 180 135, 230 165 C 260 185, 255 255, 215 275 C 175 295, 120 275, 122 225 Z"
          fill="#64748B" />

    <!-- Head outline redrawn where the eye patch meets it -->
    <path d="M 115 255 C 105 155, 175 120, 256 120"
          fill="none" stroke="#0F172A" stroke-width="12" stroke-linecap="round" />

    <!-- Tuft of fur on the forehead -->
    <path d="M 235 122 L 250 95 L 268 118 L 285 102 L 282 124"
          fill="#E2E8F0" stroke="#0F172A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Eyes (bright, with large highlights) -->
    <!-- Left eye (on the eye patch) -->
    <circle cx="185" cy="225" r="20" fill="#0F172A" />
    <circle cx="178" cy="218" r="7" fill="#FFFFFF" />
    <circle cx="192" cy="232" r="3.5" fill="#FFFFFF" />

    <!-- Right eye -->
    <circle cx="327" cy="225" r="20" fill="#0F172A" />
    <circle cx="320" cy="218" r="7" fill="#FFFFFF" />
    <circle cx="334" cy="232" r="3.5" fill="#FFFFFF" />

    <!-- Eyebrows (they add character) -->
    <path d="M 162 185 Q 185 172 205 185" fill="none" stroke="#0F172A" stroke-width="8" stroke-linecap="round" />
    <path d="M 307 185 Q 327 172 350 185" fill="none" stroke="#0F172A" stroke-width="8" stroke-linecap="round" />

    <!-- Kawaii blush -->
    <ellipse cx="148" cy="262" rx="14" ry="8" fill="#FB7185" opacity="0.65" />
    <ellipse cx="364" cy="262" rx="14" ry="8" fill="#FB7185" opacity="0.65" />

    <!-- Muzzle (light oval) -->
    <ellipse cx="256" cy="285" rx="58" ry="42" fill="#F8FAFC" stroke="#0F172A" stroke-width="10" />

    <!-- Nose -->
    <ellipse cx="256" cy="265" rx="22" ry="15" fill="#0F172A" />
    <ellipse cx="249" cy="260" rx="7" ry="4" fill="#FFFFFF" opacity="0.8" />

    <!-- Smile and a small tongue -->
    <path d="M 256 280 L 256 298" stroke="#0F172A" stroke-width="9" stroke-linecap="round" />
    <!-- Mouth shaped like horizontal { } braces -->
    <path d="M 220 295 C 232 312, 256 308, 256 292 C 256 308, 280 312, 292 295"
          fill="none" stroke="#0F172A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Collar -->
    <path d="M 152 355 Q 256 385 360 355" fill="none" stroke="url(#collar-grad)" stroke-width="26" stroke-linecap="round" />
    <path d="M 152 355 Q 256 385 360 355" fill="none" stroke="#0F172A" stroke-width="10" stroke-linecap="round" />

    <!-- API tag (a gold medallion with the code symbol </>) -->
    <circle cx="256" cy="395" r="32" fill="#FACC15" stroke="#0F172A" stroke-width="10" />
    <!-- The </> symbol on the medallion -->
    <path d="M 244 387 L 235 395 L 244 403 M 268 387 L 277 395 L 268 403 M 260 384 L 252 406"
          fill="none" stroke="#0F172A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  </g>
</svg>
