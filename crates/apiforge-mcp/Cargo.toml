[package]
name = "apiforge-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
apiforge-channel.workspace = true
apiforge-core.workspace = true
apiforge-project.workspace = true
apiforge-runner.workspace = true
apiforge-script.workspace = true
apiforge-storage.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
indexmap.workspace = true

[features]
# A spawned server driven over stdio, for other crates' tests (MCP-08b).
# Never enabled in a release build.
test-support = []

[dev-dependencies]
tempfile.workspace = true
# Live runs against the local demo API (MCP-06).
apiforge-demo-api.workspace = true
# The storage's I/O fault seam for the transaction tests of MCP-04.
apiforge-storage = { workspace = true, features = ["fault-injection"] }

[lints]
workspace = true
