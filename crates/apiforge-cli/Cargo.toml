[package]
name = "apiforge-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "apiforge"
path = "src/main.rs"

[dependencies]
apiforge-core.workspace = true
serde_json.workspace = true
apiforge-storage.workspace = true
apiforge-layout.workspace = true
apiforge-runner.workspace = true
apiforge-script.workspace = true
apiforge-project.workspace = true
apiforge-mcp.workspace = true

[dev-dependencies]
apiforge-channel.workspace = true
tokio.workspace = true
tempfile.workspace = true
# Live runs over stdio against the local demo API (MCP-06).
apiforge-demo-api.workspace = true
# Structured output checked against each tool's output schema (MCP-14).
jsonschema.workspace = true

# REL-02: the icon and version strings of apiforge.exe; build.rs does nothing
# on another target, and a Linux build never fetches this.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[lints]
workspace = true
