[package]
name = "apiforge-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
apiforge-core.workspace = true
apiforge-layout.workspace = true
apiforge-script.workspace = true
apiforge-runner.workspace = true
apiforge-storage.workspace = true
apiforge-project.workspace = true
# The control channel to an agent's server (MCP-08b).
apiforge-channel.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
indexmap.workspace = true
eframe.workspace = true
rfd.workspace = true
image.workspace = true
chrono.workspace = true

[features]
# Serves egui_inspection when EGUI_INSPECTION is set (ADR 0013). Never enabled in releases.
inspection = ["eframe/inspection"]

# REL-02: the icon and version strings of apiforge-desktop.exe; build.rs does nothing
# on another target, and a Linux build never fetches this.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

# REL-04: AttachConsole and SetStdHandle in src/windows_console.rs; a Linux
# build never fetches this.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# The workspace's lints, except that unsafe code is denied rather than
# forbidden, so that the one Windows module that needs it can allow it for
# itself (src/windows_console.rs, REL-04). Keep in step with [workspace.lints].
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"

[dev-dependencies]
apiforge-demo-api.workspace = true
tempfile.workspace = true
# The agent session of MCP-04 beside a window, a server spawned over stdio
# (MCP-08b), and the storage's I/O fault seam.
apiforge-mcp = { workspace = true, features = ["test-support"] }
apiforge-storage = { workspace = true, features = ["fault-injection"] }
egui_kittest.workspace = true
egui_inspection.workspace = true
