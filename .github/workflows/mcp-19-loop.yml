name: MCP-19 loop

# MCP-19 criterion 6, ad hoc on the ticket's branch while KTLO-33's
# flake-loop.yml has not merged: the tests of the Windows collision run 20
# times on each runner, before and after the fix. Removed before the pull
# request is accepted; the run ids are in the QA report.
on:
  push:
    branches:
      - docs/mcp-19-windows-recovery

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ROUNDS: 20
  TESTS: >-
    folder::tests::acceptance_tests::mcp10::mcp10_criterion_3_the_status_is_whole_at_960_by_540_and_the_holder_gives_way
    folder::tests::deleting_a_folder_closes_its_tabs_and_the_trash_restores_unsaved_work
    folder::tests::acceptance_tests::mcp08a::the_holders_save_is_shown_within_two_seconds_where_the_person_was
    folder::tests::acceptance_tests::mcp07::a_transaction_left_by_the_holder_opens_the_recovery_view
    folder::tests::acceptance_tests::mcp10::mcp19_criterion_4_ten_agent_writes_beside_a_window_that_checks_continuously

jobs:
  # Criterion 1's evidence before the fix: CI's workspace run of the
  # acceptance commit stopped at the first failing test binary (the
  # desktop's), before the storage tests ran on Windows. This job runs
  # them alone at that commit; it is expected to fail.
  acceptance-before-fix:
    name: Storage acceptance at d9165cf, before the fix (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d9165cfe2dc6681fb48d5de641813c7bfac54917
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
      - name: Run the MCP-19 storage acceptance tests
        run: cargo test -p apiforge-storage --lib --locked -- mcp19 --test-threads=1

  loop:
    name: Loop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libudev-dev \
            libegl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            mesa-vulkan-drivers libvulkan1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'

      - name: Build the desktop tests
        run: cargo test -p apiforge-desktop --bin apiforge-desktop --locked --no-run

      # Every round runs, so the summary counts failures rather than
      # stopping at the first; the job fails if any round failed.
      - name: Run the tests ${{ env.ROUNDS }} times
        shell: bash
        run: |
          mkdir -p loop-logs
          failed=0
          for round in $(seq 1 "$ROUNDS"); do
            if cargo test -p apiforge-desktop --bin apiforge-desktop --locked -- --exact $TESTS \
                > "loop-logs/round-$round.log" 2>&1; then
              echo "round $round: passed"
            else
              failed=$((failed + 1))
              echo "round $round: FAILED"
              grep -E '^test .* FAILED$|panicked at|^---- ' "loop-logs/round-$round.log" || true
            fi
          done
          echo "MCP-19 loop on ${{ matrix.os }}: $failed of $ROUNDS rounds failed" | tee loop-logs/summary.txt
          test "$failed" -eq 0

      - name: Upload the loop logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-19-loop-${{ matrix.os }}
          path: loop-logs
