name: CI

on:
  push:
  pull_request:

# Minimal read-only permissions for repository contents
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            binary_path: target/release/apiforge-desktop
          - os: windows-2022
            binary_path: target/release/apiforge-desktop.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install native system libraries required by eframe (X11, Wayland, wgpu/EGL, input) on Linux
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            libudev-dev \
            libegl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            xvfb \
            xauth \
            mesa-vulkan-drivers \
            libvulkan1

      # Pin Rust toolchain to match rust-toolchain.toml with formatting and linting components
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy

      # REL-03 (#120): the third-party notices every package carries. A
      # dependency whose licence about.toml does not accept, or a crate the
      # file misses, fails here on every push and not in the release. The
      # same pinned cargo-about as release.yml.
      - name: Download cargo-about
        if: runner.os == 'Linux'
        shell: bash
        env:
          CARGO_ABOUT_URL: https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz
          CARGO_ABOUT_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af
        run: |
          tools="$RUNNER_TEMP/cargo-about"
          mkdir -p "$tools"
          curl -fsSL --retry 3 -o "$tools/cargo-about.tar.gz" "$CARGO_ABOUT_URL"
          printf '%s  %s\n' "$CARGO_ABOUT_SHA256" "$tools/cargo-about.tar.gz" | sha256sum -c -
          tar xzf "$tools/cargo-about.tar.gz" -C "$tools" --strip-components 1
          echo "$tools" >> "$GITHUB_PATH"

      - name: Generate and check the third-party notices
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo about --version
          cargo fetch --locked
          mkdir -p test-results
          cargo about generate --frozen --workspace --fail -o test-results/THIRD-PARTY-NOTICES.md packaging/about.hbs \
            2> "$RUNNER_TEMP/cargo-about.log" \
            || { cat "$RUNNER_TEMP/cargo-about.log" >&2; exit 1; }
          cat "$RUNNER_TEMP/cargo-about.log" >&2
          # A stale clarify entry is only a warning to cargo-about.
          if grep -q 'failed to validate' "$RUNNER_TEMP/cargo-about.log"; then
            echo '::error::about.toml has a clarification that no longer matches its files.'
            exit 1
          fi
          for triple in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            cargo tree -e normal --locked --color never --prefix none --format '{p}' --target "$triple" \
              -p apiforge-desktop -p apiforge-cli
          done | python3 -I packaging/release.py check-notices test-results/THIRD-PARTY-NOTICES.md

      - name: Upload the third-party notices
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: third-party-notices
          path: test-results/THIRD-PARTY-NOTICES.md
          if-no-files-found: error

      - name: Test the release checks (Linux)
        if: runner.os == 'Linux'
        run: python3 -I packaging/test_release.py

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Provision Linux user runtime for MCP-12 environment tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          runtime="/run/user/$(id -u)"
          if ! test -d "$runtime"; then
            sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" "$runtime"
          fi
          test "$(stat -c %u "$runtime")" = "$(id -u)"

      - name: Run workspace unit and integration tests
        run: cargo test --workspace --all-targets --locked

      - name: Check scenario examples and the workspace fixture
        shell: bash
        run: |
          cargo run --locked -p apiforge-cli -- fmt --check fixtures/scripts/checkout.afs
          cargo run --locked -p apiforge-cli -- fmt --check fixtures/scripts/lookup.afs
          cargo run --locked -p apiforge-cli -- check --workspace fixtures/workspace.json

      # Both binaries, as release.yml builds them: REL-02 checks the icon
      # resource of each .exe below.
      - name: Build release binaries
        run: cargo build --release --locked -p apiforge-desktop -p apiforge-cli

      # REL-04: the output is read, not left to the terminal, so a shell that
      # does not wait for a windowed program still waits here.
      - name: Validate workspace using the native release binary
        shell: bash
        run: |
          output="$(./${{ matrix.binary_path }} --check fixtures/workspace.json)"
          printf '%s\n' "$output"
          if [[ ! "$output" =~ ^Valid\ v[0-9]+\ document:\ [0-9]+\ project\(s\)$ ]]; then
            echo "::error::--check did not print one Valid v<n> document line"
            exit 1
          fi

      # Exercise the actual event loop and renderer, not only the document importer.
      # Lavapipe makes this independent of a physical GPU on the Linux runner.
      - name: Open native window and capture it (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 3
        env:
          WGPU_BACKEND: vulkan
          WINIT_UNIX_BACKEND: x11
        shell: bash
        run: |
          set -euo pipefail
          # Mesa packages use both suffixed and unsuffixed ICD filenames.
          for icd in /usr/share/vulkan/icd.d/lvp_icd*.json; do
            if test -f "$icd"; then
              export VK_DRIVER_FILES="$icd"
              break
            fi
          done
          test -n "${VK_DRIVER_FILES:-}"
          mkdir -p test-results
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          trap 'rm -rf "$XDG_RUNTIME_DIR"' EXIT
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1200x24' \
            timeout --kill-after=5s 45s ./${{ matrix.binary_path }} \
            --smoke-test fixtures/workspace.json
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1200x24' \
            timeout --kill-after=5s 45s ./${{ matrix.binary_path }} \
            --screenshot test-results/native-window.png \
            --project fixtures/workspace.json \
            --select 'Cena po promocji'
          test -s test-results/native-window.png

      # Start-Process -Wait alone has no timeout. Wait with a deadline
      # and fail explicitly on nonzero exit, including renderer startup failures.
      - name: Open native window and capture it (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 3
        env:
          WGPU_BACKEND: dx12
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force test-results | Out-Null
          # REL-04: a windowed program's errors reach the job log only through
          # a file, printed whether or not the probe failed.
          function Show-Failures([string] $Path) {
            if ((Test-Path $Path -PathType Leaf) -and (Get-Item $Path).Length -gt 0) {
              Get-Content $Path | ForEach-Object { Write-Host "  $_" }
            }
          }
          function Invoke-NativeProbe([string[]] $ProbeArguments) {
            $failures = Join-Path $env:RUNNER_TEMP "native-probe-$([guid]::NewGuid()).err.log"
            $process = Start-Process -FilePath './${{ matrix.binary_path }}' `
              -ArgumentList $ProbeArguments -NoNewWindow -PassThru -RedirectStandardError $failures
            # Keep the process handle so ExitCode remains available after exit.
            $null = $process.Handle
            try {
              if (-not $process.WaitForExit(45000)) {
                & taskkill.exe /PID $process.Id /T /F | Out-Null
                throw 'Native window probe exceeded 45 seconds.'
              }
              if ($process.ExitCode -ne 0) {
                throw "Native window probe failed with exit code $($process.ExitCode)."
              }
            } finally {
              Show-Failures $failures
            }
          }
          Invoke-NativeProbe -ProbeArguments @('--smoke-test', 'fixtures/workspace.json')
          Invoke-NativeProbe -ProbeArguments @(
            '--screenshot', 'test-results/native-window.png',
            '--project', 'fixtures/workspace.json'
          )
          if (-not (Test-Path 'test-results/native-window.png' -PathType Leaf)) {
            throw 'Native screenshot was not created.'
          }
          if ((Get-Item 'test-results/native-window.png').Length -eq 0) {
            throw 'Native screenshot is empty.'
          }

      # The steps above stay inside one JSON document. Folder projects and
      # managed startup instead write, rename and sync directories, which is
      # where the two platforms differ most, so both runners exercise them
      # against a real filesystem and assert on what reaches disk.
      #
      # Each phase gets its own XDG_DATA_HOME, so none of them sees another's
      # projects, and the real one of the runner account is never used.
      - name: Exercise folder projects and managed startup (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 11
        env:
          WGPU_BACKEND: vulkan
          WINIT_UNIX_BACKEND: x11
        shell: bash
        run: |
          set -euo pipefail
          for icd in /usr/share/vulkan/icd.d/lvp_icd*.json; do
            if test -f "$icd"; then
              export VK_DRIVER_FILES="$icd"
              break
            fi
          done
          test -n "${VK_DRIVER_FILES:-}"
          mkdir -p test-results
          binary="$PWD/${{ matrix.binary_path }}"
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          scratch="$(mktemp -d)"
          trap 'rm -rf "$XDG_RUNTIME_DIR" "$scratch"' EXIT
          created="$scratch/created"
          migrated="$scratch/migrated"
          mkdir -p "$created" "$migrated/apiforge"

          # KTLO-16: each phase runs in a session of its own, so its process
          # group ID is its PID. The group is never read back with `ps`: read
          # before the child's setsid(), that returns this shell's own group,
          # and the TERM meant for the phase stopped the step instead and left
          # the phase running. Every phase has a deadline; an overrun prints
          # the phase's log, sends TERM to its group, and KILL 10 s later.
          step_group="$(ps -o pgid= -p $$ | tr -d ' ')"
          echo "Step shell $$, process group $step_group (PID PPID PGID SID COMMAND):"
          ps -e -o pid=,ppid=,pgid=,sid=,comm= | awk -v g="$step_group" '$3 == g'
          phase_pid=""
          # alive PID, or alive -GROUP: a process, or a member of the group,
          # that has not exited.
          alive() {
            ps -e -o pid=,pgid=,stat= | awk -v p="$1" \
              '(p > 0 ? $1 == p : $2 == -p) && $3 !~ /^Z/ { f = 1 } END { exit !f }'
          }
          exited() { ! alive "$phase_pid"; }
          stop_phase() {
            test -n "$phase_pid" || return 0
            local stop_by=$((SECONDS + 10))
            kill -TERM -- "-$phase_pid" 2>/dev/null || true
            while alive "-$phase_pid" && test "$SECONDS" -lt "$stop_by"; do
              sleep 0.1
            done
            if alive "-$phase_pid"; then
              echo "Process group $phase_pid outlived TERM by 10 s; sending KILL" >&2
              kill -KILL -- "-$phase_pid" 2>/dev/null || true
            fi
            wait "$phase_pid" 2>/dev/null || true
            phase_pid=""
          }
          trap 'stop_phase; rm -rf "$XDG_RUNTIME_DIR" "$scratch"' EXIT
          trap 'exit 143' TERM INT

          # phase LABEL HOME SECONDS READY ARGS...: the binary with ARGS under
          # Xvfb until READY holds; fails after SECONDS, or if it exits first.
          # Prefixed names, because a `local` would otherwise shadow the
          # variables the readiness predicate reads from this script.
          phase() {
            local phase_label="$1" phase_home="$2" phase_seconds="$3" phase_ready="$4"
            local phase_by=$((SECONDS + 5))
            shift 4
            phase_log="$scratch/$phase_label.log"
            setsid -w xvfb-run --auto-servernum --server-args='-screen 0 1920x1200x24' \
              env XDG_DATA_HOME="$phase_home" "$binary" "$@" >"$phase_log" 2>&1 &
            phase_pid=$!
            until test "$(ps -o pgid= -p "$phase_pid" | tr -d ' ')" = "$phase_pid"; do
              alive "$phase_pid" || break
              if test "$SECONDS" -ge "$phase_by"; then
                echo "Phase $phase_label: PID $phase_pid did not lead its group within 5 s" >&2
                kill -KILL "$phase_pid" 2>/dev/null || true
                phase_pid=""
                return 1
              fi
              sleep 0.1
            done
            phase_by=$((SECONDS + phase_seconds))
            until "$phase_ready"; do
              if test "$phase_ready" != exited && exited; then
                echo "Phase $phase_label exited before it was ready:" >&2
              elif test "$SECONDS" -ge "$phase_by"; then
                echo "Phase $phase_label was not ready within $phase_seconds s:" >&2
              else
                sleep 0.1
                continue
              fi
              sed 's/^/  /' "$phase_log" >&2
              stop_phase
              return 1
            done
          }

          # Managed startup opens a window and never exits by itself, so each
          # run is stopped once what it owes is on disk, within 60 s.
          managed() {
            phase "$1" "$2" 60 "$3" --managed
            # Let the storage worker finish the commit around those files
            # before the window is taken away.
            sleep 3
            stop_phase
            sed 's/^/  /' "$phase_log"
          }

          # capture LABEL ARGS...: a --screenshot run that must exit by itself,
          # successfully, within 45 s.
          capture() {
            local capture_status=0
            phase "$1" "$migrated" 45 exited "${@:2}"
            wait "$phase_pid" || capture_status=$?
            phase_pid=""
            if test "$capture_status" -ne 0; then
              echo "Capture $1 exited with status $capture_status:" >&2
              sed 's/^/  /' "$phase_log" >&2
              return 1
            fi
          }

          # 1. An empty data directory: one project is created, nothing migrated.
          project_prepared() {
            compgen -G "$created/apiforge/projects/*/apiforge.project.json" >/dev/null
          }
          managed created "$created" project_prepared

          data="$created/apiforge"
          mapfile -t roots < <(find "$data/projects" -mindepth 1 -maxdepth 1 -type d | sort)
          test "${#roots[@]}" -eq 1
          for file in apiforge.project.json .gitignore .gitattributes; do
            test -s "${roots[0]}/$file"
          done
          test ! -e "$data/workspace.json"
          test ! -e "$data/projects.json"
          echo "created: ${roots[0]##*/}"

          # 2. A legacy workspace: migrated once and left byte-identical. The
          # store writes plain workspace JSON, so the fixture is one.
          data="$migrated/apiforge"
          cp fixtures/workspace.json "$data/workspace.json"
          before="$(sha256sum <"$data/workspace.json" | cut -d' ' -f1)"
          catalogue_written() { test -f "$data/projects.json"; }
          managed migrated "$migrated" catalogue_written

          # The project IDs of fixtures/workspace.json.
          for project in shop tickets blocks-poc workflow-poc; do
            test -s "$data/projects/$project/apiforge.project.json"
            test -s "$data/projects/$project/.gitignore"
            test -s "$data/projects/$project/.gitattributes"
          done
          after="$(sha256sum <"$data/workspace.json" | cut -d' ' -f1)"
          test "$before" = "$after"
          catalogue() {
            python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])' \
              "$data/projects.json" "$1"
          }
          migration="$(catalogue migrationId)"
          test -n "$migration"
          echo "migrated: $migration, workspace sha256 $after unchanged"

          # 3. A restart reads that migration instead of repeating it. Opening a
          # project rewrites the recent-project file, which is the signal that
          # the restart got as far as a project rather than stalling.
          roots="$(find "$data/projects" -mindepth 1 -maxdepth 1 -type d | wc -l)"
          stamp="$(stat -c %y "$data/recent-projects.json")"
          reopened() {
            test "$(stat -c %y "$data/recent-projects.json")" != "$stamp"
          }
          managed restarted "$migrated" reopened

          test "$(catalogue migrationId)" = "$migration"
          test "$(find "$data/projects" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq "$roots"
          echo "restarted: migration $migration kept, $roots project(s)"

          # 4. A migrated project renders. `tickets` was written by migration and
          # never opened, so this opens migration output from cold. Opening a
          # folder records it in the data directory's recent projects, so the
          # run keeps the scratch one.
          capture folder --screenshot test-results/native-folder.png \
            --folder "$data/projects/tickets"
          test -s test-results/native-folder.png

          # 5. QA captures (KTLO-08): the migrated demo shop in every mode at
          # both standard sizes, for QA reports to cite. Xvfb draws at a scale
          # of one, so each capture must be exactly the size asked for.
          mkdir -p test-results/qa
          png_size() {
            python3 -c 'import struct,sys; d=open(sys.argv[1],"rb").read(24); print("%dx%d" % struct.unpack(">II", d[16:24]))' "$1"
          }
          for mode in code diagram split; do
            for size in 960x540 1600x1000; do
              shot="test-results/qa/$mode-$size.png"
              capture "qa-$mode-$size" --screenshot "$shot" \
                --folder "$data/projects/shop" --mode "$mode" --size "$size"
              test -s "$shot"
              test "$(png_size "$shot")" = "$size"
              echo "captured: $shot"
            done
          done

      # The same cover on Windows. `dirs::data_dir()` resolves
      # FOLDERID_RoamingAppData through SHGetKnownFolderPath, which ignores
      # %APPDATA%, so `--managed` cannot be pointed at a scratch directory here:
      # the roaming directory of the runner account is reset between phases
      # instead. Nothing else in the job writes folder projects into it.
      - name: Exercise folder projects and managed startup (Windows)
        id: folder-windows
        if: runner.os == 'Windows'
        timeout-minutes: 11
        env:
          WGPU_BACKEND: dx12
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force test-results | Out-Null
          $binary = './${{ matrix.binary_path }}'
          # The same known folder dirs::data_dir() asks for.
          $roaming = [Environment]::GetFolderPath('ApplicationData')
          if ([string]::IsNullOrWhiteSpace($roaming)) {
            throw 'This system has no roaming application data directory.'
          }
          $data = Join-Path $roaming 'apiforge'
          $projects = Join-Path $data 'projects'
          $catalogue = Join-Path $data 'projects.json'
          $workspace = Join-Path $data 'workspace.json'
          $recent = Join-Path $data 'recent-projects.json'
          $scratch = (New-Item -ItemType Directory -Path (
            Join-Path ([System.IO.Path]::GetTempPath()) ([guid]::NewGuid())
          )).FullName
          $owned = $false

          # The workspace tests open folder projects through
          # RecentProjects::default(), so recent-projects.json is expected to be
          # here already. A real workspace or real projects stop the step rather
          # than being cleared, which only matters on a self-hosted runner.
          function Reset-DataDirectory {
            if (Test-Path $data) {
              if (-not $script:owned) {
                foreach ($name in @('workspace.json', 'projects.json', 'projects')) {
                  if (Test-Path (Join-Path $data $name)) {
                    throw "$data already holds $name; clear it by hand before this step."
                  }
                }
              }
              # A handle of the run just stopped can outlive the process for a
              # moment, so removal is retried before it is called a failure.
              foreach ($attempt in 1..3) {
                try {
                  Remove-Item -Recurse -Force $data
                  break
                } catch {
                  if ($attempt -eq 3) {
                    throw
                  }
                  Start-Sleep -Seconds 2
                }
              }
            }
            $script:owned = $true
            New-Item -ItemType Directory -Force $data | Out-Null
          }

          # --managed opens a window and never exits by itself, so each run is
          # stopped once what it owes is on disk. A run that writes nothing, or
          # that exits early, fails on its own deadline instead of hanging the
          # job.
          function Invoke-Managed([string] $Label, [scriptblock] $Ready) {
            $out = Join-Path $scratch "$Label.out.log"
            $failures = Join-Path $scratch "$Label.err.log"
            $process = Start-Process -FilePath $binary -ArgumentList @('--managed') `
              -NoNewWindow -PassThru -RedirectStandardOutput $out -RedirectStandardError $failures
            # Keep the process handle so ExitCode remains available after exit.
            $null = $process.Handle
            $deadline = (Get-Date).AddSeconds(60)
            # Not $ready: PowerShell names ignore case, so that is the parameter.
            $owed = $false
            try {
              while ((Get-Date) -lt $deadline) {
                if (& $Ready) {
                  $owed = $true
                  break
                }
                if ($process.HasExited) {
                  break
                }
                Start-Sleep -Seconds 1
              }
              if ($owed) {
                # Let the storage worker finish the commit around those files
                # before the window is taken away.
                Start-Sleep -Seconds 3
              }
            } finally {
              # Whatever happened above, the window does not outlive this run.
              if (-not $process.HasExited) {
                & taskkill.exe /PID $process.Id /T /F | Out-Null
              }
              $null = $process.WaitForExit(15000)
              foreach ($log in @($out, $failures)) {
                if ((Test-Path $log -PathType Leaf) -and (Get-Item $log).Length -gt 0) {
                  Get-Content $log | ForEach-Object { Write-Host "  $_" }
                }
              }
            }
            if (-not $owed) {
              throw "Managed startup ($Label) did not write what it owes within 60 seconds."
            }
          }

          function Assert-ProjectFiles([string] $Root) {
            foreach ($name in @('apiforge.project.json', '.gitignore', '.gitattributes')) {
              $file = Join-Path $Root $name
              if (-not (Test-Path $file -PathType Leaf)) {
                throw "$Root is missing $name."
              }
              if ((Get-Item $file).Length -eq 0) {
                throw "$Root has an empty $name."
              }
            }
          }

          # REL-04: a windowed capture's errors reach the job log only through
          # a file, printed whether or not the capture failed.
          function Show-Failures([string] $Path) {
            if ((Test-Path $Path -PathType Leaf) -and (Get-Item $Path).Length -gt 0) {
              Get-Content $Path | ForEach-Object { Write-Host "  $_" }
            }
          }

          function Get-MigrationId {
            $id = (Get-Content $catalogue -Raw | ConvertFrom-Json).migrationId
            if ([string]::IsNullOrWhiteSpace($id)) {
              throw 'The project catalogue carries no migration ID.'
            }
            return $id
          }

          # 1. An empty data directory: one project is created, nothing migrated.
          Reset-DataDirectory
          Invoke-Managed 'created' {
            @(Get-ChildItem $projects -Directory -ErrorAction SilentlyContinue |
              Where-Object {
                Test-Path (Join-Path $_.FullName 'apiforge.project.json') -PathType Leaf
              }).Count -ge 1
          }
          $roots = @(Get-ChildItem $projects -Directory)
          if ($roots.Count -ne 1) {
            throw "Managed startup created $($roots.Count) projects; expected one."
          }
          Assert-ProjectFiles $roots[0].FullName
          foreach ($name in @('workspace.json', 'projects.json')) {
            if (Test-Path (Join-Path $data $name)) {
              throw "Managed startup wrote $name without migrating anything."
            }
          }
          Write-Host "created: $($roots[0].Name)"

          # 2. A legacy workspace: migrated once and left byte-identical. The
          # store writes plain workspace JSON, so the fixture is one.
          Reset-DataDirectory
          Copy-Item 'fixtures/workspace.json' $workspace
          $before = (Get-FileHash $workspace -Algorithm SHA256).Hash
          Invoke-Managed 'migrated' { Test-Path $catalogue -PathType Leaf }

          # The project IDs of fixtures/workspace.json.
          foreach ($project in @('shop', 'tickets', 'blocks-poc', 'workflow-poc')) {
            Assert-ProjectFiles (Join-Path $projects $project)
          }
          $after = (Get-FileHash $workspace -Algorithm SHA256).Hash
          if ($before -ne $after) {
            throw "Migration changed the original workspace: $before became $after."
          }
          $migration = Get-MigrationId
          Write-Host "migrated: $migration, workspace SHA256 $after unchanged"

          # 3. A restart reads that migration instead of repeating it. Opening a
          # project rewrites the recent-project file, which is the signal that
          # the restart got as far as a project rather than stalling.
          $count = @(Get-ChildItem $projects -Directory).Count
          $stamp = (Get-Item $recent).LastWriteTimeUtc.Ticks
          Invoke-Managed 'restarted' {
            (Test-Path $recent -PathType Leaf) -and
              ((Get-Item $recent).LastWriteTimeUtc.Ticks -ne $stamp)
          }
          $again = Get-MigrationId
          if ($again -ne $migration) {
            throw "The restart replaced migration $migration with $again."
          }
          $restarted = @(Get-ChildItem $projects -Directory).Count
          if ($restarted -ne $count) {
            throw "The restart left $restarted projects; expected $count."
          }
          Write-Host "restarted: migration $migration kept, $count project(s)"

          # 4. A migrated project renders. `tickets` was written by migration and
          # never opened, so this opens migration output from cold.
          $capture = 'test-results/native-folder.png'
          $failures = Join-Path $scratch 'folder.err.log'
          $process = Start-Process -FilePath $binary -NoNewWindow -PassThru -RedirectStandardError $failures -ArgumentList @(
            '--screenshot', $capture,
            '--folder', (Join-Path $projects 'tickets')
          )
          $null = $process.Handle
          try {
            if (-not $process.WaitForExit(45000)) {
              & taskkill.exe /PID $process.Id /T /F | Out-Null
              throw 'The folder-window capture exceeded 45 seconds.'
            }
            if ($process.ExitCode -ne 0) {
              throw "The folder-window capture failed with exit code $($process.ExitCode)."
            }
          } finally {
            Show-Failures $failures
          }
          if (-not (Test-Path $capture -PathType Leaf)) {
            throw 'The folder-window capture was not created.'
          }
          if ((Get-Item $capture).Length -eq 0) {
            throw 'The folder-window capture is empty.'
          }

          # 5. QA captures (KTLO-08): the migrated demo shop in every mode at
          # both standard sizes, for QA reports to cite. The runner's display
          # can be smaller than a window, so a capture of another size is
          # reported rather than failed.
          New-Item -ItemType Directory -Force 'test-results/qa' | Out-Null
          foreach ($mode in @('code', 'diagram', 'split')) {
            foreach ($size in @('960x540', '1600x1000')) {
              $capture = "test-results/qa/$mode-$size.png"
              $failures = Join-Path $scratch "qa-$mode-$size.err.log"
              $process = Start-Process -FilePath $binary -NoNewWindow -PassThru -RedirectStandardError $failures -ArgumentList @(
                '--screenshot', $capture,
                '--folder', (Join-Path $projects 'shop'),
                '--mode', $mode,
                '--size', $size
              )
              $null = $process.Handle
              try {
                if (-not $process.WaitForExit(45000)) {
                  & taskkill.exe /PID $process.Id /T /F | Out-Null
                  throw "The $mode $size capture exceeded 45 seconds."
                }
                if ($process.ExitCode -ne 0) {
                  throw "The $mode $size capture failed with exit code $($process.ExitCode)."
                }
              } finally {
                Show-Failures $failures
              }
              if (-not (Test-Path $capture -PathType Leaf) -or (Get-Item $capture).Length -eq 0) {
                throw "The $mode $size capture is missing or empty."
              }
              # PNG width and height: big-endian at bytes 16 and 20.
              $bytes = [System.IO.File]::ReadAllBytes($capture)
              $width = ([int]$bytes[16] -shl 24) + ([int]$bytes[17] -shl 16) + ([int]$bytes[18] -shl 8) + $bytes[19]
              $height = ([int]$bytes[20] -shl 24) + ([int]$bytes[21] -shl 16) + ([int]$bytes[22] -shl 8) + $bytes[23]
              if ("${width}x${height}" -ne $size) {
                Write-Host "::warning::$capture is ${width}x${height}, not $size."
              }
              Write-Host "captured: $capture (${width}x${height})"
            }
          }

      # REL-02 (#119): the icon and version strings each release .exe carries
      # as a Windows resource, read back the way Explorer reads them, and the
      # running window with its icon in the title bar and on the taskbar. The
      # extracted icons and the desktop capture are the artifact windows-icon.
      # The window opens the demo shop that the step above migrated.
      # REL-04 (#205): the PE subsystem of each .exe, and the window started
      # the way Explorer starts it owns no console.
      - name: Show the application icon (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 3
        env:
          WGPU_BACKEND: dx12
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Reflection.Metadata
          $out = 'test-results/icon'
          New-Item -ItemType Directory -Force $out | Out-Null
          # REL-04: what is wrong with the subsystems and the console is
          # reported together at the end, so one run shows all of it.
          $problems = @()

          # 0. REL-04 criterion 1: the release desktop binary is a windowed
          # program (WindowsGui); the command line and the debug build that
          # cargo test made keep their console (WindowsCui).
          $subsystems = @(
            @{ Exe = 'target/release/apiforge-desktop.exe'; Subsystem = 'WindowsGui' }
            @{ Exe = 'target/release/apiforge.exe'; Subsystem = 'WindowsCui' }
            @{ Exe = 'target/debug/apiforge-desktop.exe'; Subsystem = 'WindowsCui' }
          )
          foreach ($binary in $subsystems) {
            $reader = [System.Reflection.PortableExecutable.PEReader]::new(
              [System.IO.File]::OpenRead((Resolve-Path $binary.Exe).Path))
            try {
              $subsystem = [string] $reader.PEHeaders.PEHeader.Subsystem
            } finally {
              $reader.Dispose()
            }
            Write-Host "$($binary.Exe): PE subsystem $subsystem"
            if ($subsystem -ne $binary.Subsystem) {
              $problems += "$($binary.Exe) has PE subsystem $subsystem, expected $($binary.Subsystem)."
            }
          }

          # 1. Each .exe: the version resource, then its associated icon at
          # the shell's 32 x 32, against the PNG the .ico was built from.
          $source = [System.Drawing.Bitmap]::new((Resolve-Path 'packaging/icon/apiforge-32.png').Path)
          $binaries = @(
            @{ Name = 'apiforge'; Exe = 'target/release/apiforge.exe'; Description = 'API Forge command line' }
            @{ Name = 'apiforge-desktop'; Exe = 'target/release/apiforge-desktop.exe'; Description = 'API Forge' }
          )
          foreach ($binary in $binaries) {
            $name = $binary.Name
            $exe = (Resolve-Path $binary.Exe).Path
            $info = (Get-Item $exe).VersionInfo
            # REL-04: PowerShell waits for a windowed program, and reads what
            # it prints, only when its output goes on down a pipeline.
            $version = (& $exe --version | Write-Output) -replace "^$([regex]::Escape($name)) ", ''
            Write-Host ("{0}.exe: ProductName '{1}', FileDescription '{2}', ProductVersion '{3}', FileVersion '{4}'" -f `
              $name, $info.ProductName, $info.FileDescription, $info.ProductVersion, $info.FileVersion)
            if ($info.ProductName -ne 'API Forge' -or $info.FileDescription -ne $binary.Description -or
                $info.ProductVersion -ne $version -or $info.FileVersion -ne $version) {
              throw "$name.exe carries the wrong version resource."
            }
            $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
            $bitmap = $icon.ToBitmap()
            $bitmap.Save((Join-Path $out "$name-exe-icon.png"), [System.Drawing.Imaging.ImageFormat]::Png)
            if ($bitmap.Width -ne 32 -or $bitmap.Height -ne 32) {
              throw "The icon of $name.exe is $($bitmap.Width) x $($bitmap.Height), not 32 x 32."
            }
            if ($bitmap.GetPixel(0, 0).A -ne 0) {
              throw "The icon of $name.exe has an opaque corner."
            }
            if ($bitmap.GetPixel(16, 16).A -ne 255) {
              throw "The icon of $name.exe has a transparent centre."
            }
            # Not Windows' generic program icon: the pixels of apiforge-32.png,
            # colour compared where both are mostly opaque.
            $worst = 0
            for ($y = 0; $y -lt 32; $y++) {
              for ($x = 0; $x -lt 32; $x++) {
                $a = $bitmap.GetPixel($x, $y)
                $b = $source.GetPixel($x, $y)
                $differences = @([math]::Abs($a.A - $b.A))
                if ($a.A -ge 128 -and $b.A -ge 128) {
                  $differences += [math]::Abs($a.R - $b.R), [math]::Abs($a.G - $b.G), [math]::Abs($a.B - $b.B)
                }
                $worst = [math]::Max($worst, ($differences | Measure-Object -Maximum).Maximum)
              }
            }
            Write-Host "$name.exe: icon 32 x 32, largest channel difference from apiforge-32.png $worst"
            if ($worst -gt 8) {
              throw "The icon of $name.exe differs from packaging/icon/apiforge-32.png by up to $worst."
            }
          }

          # 2. The window: started like a person would, captured with the
          # whole desktop once it is on screen, then ended. REL-04 criterion
          # 2: started the way Explorer starts it, without -NoNewWindow and
          # without redirection, it owns no console; a console program
          # started this way has its own conhost.exe.
          $data = Join-Path ([Environment]::GetFolderPath('ApplicationData')) 'apiforge'
          $shop = Join-Path $data 'projects/shop'
          if (-not (Test-Path (Join-Path $shop 'apiforge.project.json') -PathType Leaf)) {
            throw "$shop holds no project; the folder project step migrates it."
          }
          $program = (Resolve-Path 'target/release/apiforge-desktop.exe').Path
          $process = Start-Process -FilePath $program -ArgumentList @('--folder', $shop) -PassThru
          $null = $process.Handle
          try {
            $deadline = (Get-Date).AddSeconds(45)
            while ($process.MainWindowHandle -eq [IntPtr]::Zero) {
              if ($process.HasExited) {
                throw "apiforge-desktop.exe exited with code $($process.ExitCode) before its window opened."
              }
              if ((Get-Date) -gt $deadline) {
                throw 'The window did not open within 45 seconds.'
              }
              Start-Sleep -Milliseconds 500
              $process.Refresh()
            }
            # A few frames, so the capture shows the drawn window; it must
            # still be open when the capture is taken and after it.
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited -or $process.MainWindowHandle -eq [IntPtr]::Zero) {
              throw 'The window closed before it was captured.'
            }
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $desktop = [System.Drawing.Bitmap]::new($bounds.Width, $bounds.Height)
            $graphics = [System.Drawing.Graphics]::FromImage($desktop)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $graphics.Dispose()
            $desktop.Save((Join-Path $out 'desktop-window.png'), [System.Drawing.Imaging.ImageFormat]::Png)
            if ($process.HasExited) {
              throw "apiforge-desktop.exe exited with code $($process.ExitCode) while it was captured."
            }
            Write-Host "captured: $out/desktop-window.png ($($bounds.Width) x $($bounds.Height)), window '$($process.MainWindowTitle)'"
            # The process tree while the window is open.
            $record = Get-CimInstance Win32_Process -Filter "ProcessId=$($process.Id)"
            $creator = Get-CimInstance Win32_Process -Filter "ProcessId=$($record.ParentProcessId)"
            $children = @(Get-CimInstance Win32_Process -Filter "ParentProcessId=$($process.Id)")
            Write-Host ("process tree: {0} ({1}) > apiforge-desktop.exe ({2}) > {3}" -f `
              $creator.Name, $record.ParentProcessId, $process.Id,
              $(if ($children.Count -gt 0) { ($children | ForEach-Object { "$($_.Name) ($($_.ProcessId))" }) -join ', ' } else { 'no child process' }))
            $consoles = @(Get-CimInstance Win32_Process -Filter "Name='conhost.exe' AND ParentProcessId=$($process.Id)")
            if ($consoles.Count -ne 0) {
              $problems += "apiforge-desktop.exe owns a console: conhost.exe $(($consoles | ForEach-Object { $_.ProcessId }) -join ', ')."
            }
          } finally {
            if (-not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F | Out-Null
            }
            $null = $process.WaitForExit(15000)
            # Started without handles, the window writes what it prints to its
            # log, not to the job log.
            $log = Join-Path $data 'logs/apiforge-desktop.log'
            if (Test-Path $log -PathType Leaf) {
              Write-Host "${log}:"
              Get-Content $log | ForEach-Object { Write-Host "  $_" }
            }
          }
          if ($problems.Count -gt 0) {
            throw ($problems -join ' ')
          }

      # REL-04 (#205), criteria 4 and 7. Started by a parent with no console
      # (Win32_Process.Create, whose parent is the WMI host), as from
      # Explorer, the release desktop binary writes its output to the log
      # beside the managed projects: one block per start, a log over 1 MiB
      # renamed to .log.1 first. Output that cmd redirects still reaches its
      # file; started by cmd without a redirection, the program attaches to
      # no console (decision 2 = B) and writes the line to the log. The data directory is the one the folder project step owned and
      # reset, so no real log is touched; the step needs only that and the
      # release binary, so it also runs when the window step above failed.
      - name: Write the desktop log without a console (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.folder-windows.outcome == 'success' }}
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $program = (Resolve-Path 'target/release/apiforge-desktop.exe').Path
          $fixture = (Resolve-Path 'fixtures/workspace.json').Path
          $logs = Join-Path ([Environment]::GetFolderPath('ApplicationData')) 'apiforge/logs'
          $log = Join-Path $logs 'apiforge-desktop.log'
          $rotated = Join-Path $logs 'apiforge-desktop.log.1'
          if (-not ((Get-Content 'Cargo.toml' -Raw) -match '(?m)^\[workspace\.package\]\s+version = "([^"]+)"')) {
            throw 'Cargo.toml has no workspace version.'
          }
          $version = $Matches[1]
          # What --check prints. PowerShell waits for a windowed program, and
          # reads its output, only when the output goes on down a pipeline.
          $valid = & $program --check $fixture | Write-Output
          if ($LASTEXITCODE -ne 0 -or "$valid" -notmatch '^Valid v\d+ document: \d+ project\(s\)$') {
            throw "apiforge-desktop.exe --check printed '$valid' with exit code $LASTEXITCODE."
          }

          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class Rel04Process {
              [DllImport("ntdll.dll")]
              public static extern int NtResumeProcess(IntPtr process);
          }
          '@

          # Created suspended, so that its exit code can be read however fast
          # it ends, then resumed.
          function Invoke-WithoutConsole([string] $Label) {
            $startup = New-CimInstance -ClassName Win32_ProcessStartup -ClientOnly -Property @{
              CreateFlags = [uint32] 4
            }
            $created = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{
              CommandLine = "`"$program`" --check `"$fixture`""
              CurrentDirectory = (Get-Location).Path
              ProcessStartupInformation = $startup
            }
            if ($created.ReturnValue -ne 0) {
              throw "Win32_Process.Create returned $($created.ReturnValue) ($Label)."
            }
            $process = Get-Process -Id $created.ProcessId
            $null = $process.Handle
            try {
              $record = Get-CimInstance Win32_Process -Filter "ProcessId=$($process.Id)"
              $creator = Get-CimInstance Win32_Process -Filter "ProcessId=$($record.ParentProcessId)"
              Write-Host ("{0}: apiforge-desktop.exe ({1}) started by {2} ({3})" -f `
                $Label, $process.Id, $creator.Name, $record.ParentProcessId)
              if ([Rel04Process]::NtResumeProcess($process.Handle) -ne 0) {
                throw "apiforge-desktop.exe ($Label) could not be resumed."
              }
              if (-not $process.WaitForExit(45000)) {
                throw "apiforge-desktop.exe --check ($Label) exceeded 45 seconds."
              }
              if ($process.ExitCode -ne 0) {
                throw "apiforge-desktop.exe --check ($Label) exited with code $($process.ExitCode)."
              }
            } finally {
              if (-not $process.HasExited) {
                & taskkill.exe /PID $process.Id /T /F | Out-Null
              }
            }
          }

          # The log ends with this start's line and what --check printed.
          function Assert-Log([string] $Label, [int] $Starts) {
            if (-not (Test-Path $log -PathType Leaf)) {
              throw "${Label}: $log was not written."
            }
            $lines = @(Get-Content $log)
            Write-Host "${Label}: $log"
            $lines | ForEach-Object { Write-Host "  $_" }
            $found = @($lines | Where-Object { $_ -match '^--- apiforge-desktop ' }).Count
            if ($found -ne $Starts) {
              throw "${Label}: the log holds $found start lines; expected $Starts."
            }
            $start = "^--- apiforge-desktop $([regex]::Escape($version)) .+ ---$"
            if ($lines.Count -lt 2 -or $lines[-2] -notmatch $start -or $lines[-1] -ne "$valid") {
              throw "${Label}: the log does not end with a start line and '$valid'."
            }
          }

          if (Test-Path $logs) {
            Remove-Item -Recurse -Force $logs
          }
          Invoke-WithoutConsole 'first'
          Assert-Log 'first' 1
          Invoke-WithoutConsole 'second'
          Assert-Log 'second' 2

          # A log over 1 MiB at start is renamed to apiforge-desktop.log.1.
          $full = 1MB + 1
          [System.IO.File]::WriteAllBytes($log, [byte[]]::new($full))
          Invoke-WithoutConsole 'rotated'
          if (-not (Test-Path $rotated -PathType Leaf) -or (Get-Item $rotated).Length -ne $full) {
            throw "A log of $full bytes was not renamed to $rotated."
          }
          Write-Host "rotated: $rotated holds the $full bytes of the previous log"
          Assert-Log 'rotated' 1

          # Criterion 7: cmd /c with its output redirected to a file. cmd need
          # not wait for a windowed program, so the file is awaited.
          $redirected = Join-Path $env:RUNNER_TEMP 'rel-04-version.txt'
          Remove-Item -Force -ErrorAction SilentlyContinue $redirected
          & cmd.exe /c "$program --version > $redirected"
          $deadline = (Get-Date).AddSeconds(15)
          $line = ''
          while ((Get-Date) -lt $deadline) {
            if (Test-Path $redirected -PathType Leaf) {
              $line = (Get-Content $redirected -Raw) -replace '\r?\n$', ''
              if ($line) {
                break
              }
            }
            Start-Sleep -Milliseconds 250
          }
          Write-Host "cmd /c `"apiforge-desktop.exe --version > file`" wrote '$line'"
          if ($line -ne "apiforge-desktop $version") {
            throw "cmd /c with a redirection wrote '$line', expected 'apiforge-desktop $version'."
          }

          # Decision 2 = B: without a redirection the line goes to the log as a
          # new block, not to cmd's console. cmd runs in a console of its own,
          # as in a terminal, not on this step's pipes.
          Start-Process -FilePath cmd.exe -ArgumentList @('/c', "$program --version") -Wait
          $deadline = (Get-Date).AddSeconds(15)
          $lines = @()
          while ((Get-Date) -lt $deadline) {
            $lines = @(Get-Content $log)
            if ($lines.Count -gt 0 -and $lines[-1] -eq "apiforge-desktop $version") {
              break
            }
            Start-Sleep -Milliseconds 250
          }
          Write-Host "cmd /c `"apiforge-desktop.exe --version`": $log"
          $lines | ForEach-Object { Write-Host "  $_" }
          $start = "^--- apiforge-desktop $([regex]::Escape($version)) .+ ---$"
          if ($lines.Count -lt 2 -or $lines[-1] -ne "apiforge-desktop $version" -or $lines[-2] -notmatch $start) {
            throw "cmd /c without a redirection did not write 'apiforge-desktop $version' to the log in a new block."
          }

      - name: Upload the application icon (Windows)
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-icon
          path: test-results/icon/
          if-no-files-found: warn

      - name: Upload native window captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-window-${{ matrix.os }}
          path: |
            test-results/native-window.png
            test-results/native-folder.png
          if-no-files-found: warn

      # KTLO-08: the folder window in each mode at both standard sizes, which
      # QA reports cite as the evidence of this platform.
      - name: Upload QA captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-captures-${{ matrix.os }}
          path: test-results/qa/*.png
          if-no-files-found: warn

      # These binaries are build artifacts, not signed production installers.
      # Upload only the compiled release binary per OS; fail if binary is missing
      - name: Upload release binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: apiforge-desktop-${{ matrix.os }}
          path: ${{ matrix.binary_path }}
          if-no-files-found: error
