[workspace]
members = [
    "crates/apiforge-core",
    "crates/apiforge-demo-api",
    "crates/apiforge-desktop",
    "crates/apiforge-runner",
    "crates/apiforge-storage",
    "crates/apiforge-script",
    "crates/apiforge-cli",
    "tools/convert-v1",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
apiforge-core = { path = "crates/apiforge-core" }
apiforge-runner = { path = "crates/apiforge-runner" }
apiforge-storage = { path = "crates/apiforge-storage" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "preserve_order"] }
indexmap = { version = "=2.14.2", features = ["serde"] }
thiserror = "=2.0.21"
libm = "=0.2.16"
uuid = { version = "=1.28.0", features = ["v4"] }
dirs = "=6.0.0"
tempfile = "=3.27.0"
# Local demo API: HTTP/1 only, a current-thread runtime and no tracing or macros.
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
# HTTP/1.1 only with rustls; no implicit proxy, cookie or decompression behaviour.
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
tokio = { version = "=1.53.2", default-features = false, features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "=0.7.19", default-features = false }
url = "=2.5.8"
# Keep the tested egui release while the native editor is migrated.
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "wayland", "wgpu", "x11"] }
rfd = "=0.17.2"
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
