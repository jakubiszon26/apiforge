# cargo-about's configuration for licenses/THIRD-PARTY-NOTICES.md (REL-03,
# #120), generated with packaging/about.hbs; see docs/development.md, Releases.
#
# Exactly the licences of the workspace's dependencies, all compatible with
# the project's licence (LICENSE). The order matters: a crate offering a
# choice is listed under the first of these it offers, so self_cell and r-efi,
# which also offer a GNU licence, are listed under a permissive one.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
# The two release targets; workspace crates, build scripts and test-only
# dependencies are not in the binaries.
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }

# The fonts egui embeds: the crate's licence files are under fonts/, which
# cargo-about does not read by itself. Hack-Regular.txt holds the MIT licence
# of Hack and the Bitstream Vera licence of the glyphs it derives from; both
# texts are reproduced. A new version with other files fails the checksums,
# which cargo-about only warns about; the workflows fail on that warning.
[epaint_default_fonts.clarify]
license = "(MIT OR Apache-2.0) AND MIT AND OFL-1.1 AND Ubuntu-font-1.0"

[[epaint_default_fonts.clarify.files]]
path = "fonts/Hack-Regular.txt"
license = "MIT"
checksum = "47c0cccbeec7e8614548cc485588b28149e7874188df5f41b36efebcee285c87"

[[epaint_default_fonts.clarify.files]]
path = "fonts/UFL.txt"
license = "Ubuntu-font-1.0"
checksum = "2f0015108d68627bd788d313f529c21ff4da2c2c42a5e1f3883acc83480f9002"

[[epaint_default_fonts.clarify.files]]
path = "fonts/OFL.txt"
license = "OFL-1.1"
checksum = "6a73f9541c2de74158c0e7cf6b0a58ef774f5a780bf191f2d7ec9cc53efe2bf2"

[[epaint_default_fonts.clarify.files]]
path = "fonts/emoji-icon-font-mit-license.txt"
license = "MIT"
